<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bizgarh Reviews | Stock Market Course Feedback from Indian Learners</title>
  <meta name="description" content="520 learner notes on Bizgarh stock market courses, webinars, and mentorship desks. Honest classroom feedback, not a highlight reel.">
  <script src="/js/seo.js?v=seo3" defer></script>
  <script src="/js/boot.js?v=home7"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="/css/fonts.css?v=hang1">
  <link rel="stylesheet" href="/css/style.css?v=dash64">
</head>
<body>
  <div id="bgBoot" aria-busy="true" aria-label="Loading Bizgarh"></div>
  <div id="site-header"></div>
  <main class="page">
    <section class="page-hero">
      <div class="container">
        <h1>Learner reviews</h1>
        <p class="muted" id="reviewsSummary">Notes from people who actually sat with the lessons.</p>
        <div class="filters" id="reviewFilters">
          <button class="chip active" data-rev="all">All</button>
          <button class="chip" data-rev="5">5 star</button>
          <button class="chip" data-rev="4">4 star</button>
          <button class="chip" data-rev="3">3 star & below</button>
          <button class="chip" data-rev="hi">Hinglish</button>
          <button class="chip" data-rev="en">English</button>
          <button class="chip" data-rev="course">Courses</button>
          <button class="chip" data-rev="webinar">Webinars</button>
          <button class="chip" data-rev="mentor">Mentorship</button>
        </div>
        <input class="review-search" id="reviewSearch" type="search" placeholder="Search name, city or course...">
      </div>
    </section>
    <section class="section" style="padding-top:12px">
      <div class="container">
        <div class="reviews-grid" id="reviewsGrid"></div>
        <div class="reviews-more">
          <button class="btn btn-primary" id="loadMoreReviews" type="button">Load more</button>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="/js/app.js?v=desk19" defer></script>
  <script src="/js/lms.js" defer></script>
</body>
</html>
