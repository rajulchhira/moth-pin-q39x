<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting | Bizgarh</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get("id");
      location.replace(id ? "/course?id=" + encodeURIComponent(id) : "/courses");
    })();
  </script>
</head>
<body>
  <p>This classroom now lives on the course page. <a href="/courses">Browse courses</a></p>
</body>
</html>
