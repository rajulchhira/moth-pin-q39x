name: bizgarh_mobile
description: Bizgarh native mobile app — stock market courses, mentorship, and learning.
publish_to: "none"
version: 1.1.12+14

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/bizgarh-launcher-icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/bizgarh-launcher-adaptive-fg.png
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true
  assets:
    - assets/bizgarh-icon.png
    - assets/bizgarh-lockup.png
    - assets/bizgarh-launcher-icon.png
    - assets/bizgarh-launcher-adaptive-fg.png
    - assets/bizgarh-launcher-source.png
    - assets/bizgarh-launcher-white-badge.png
    - assets/bizgarh-launcher-white-mark.png
    - assets/bizgarh-launcher-original-logo.png
    - assets/bizgarh-launcher-true-original.png
    - assets/bizgarh-launcher-white-bg-ref.png
    - assets/bizgarh-mark.svg
    - assets/fonts/
    - assets/mentors/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
