<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact | Bizgarh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=dash3">
  <script src="js/boot.js?v=spin1"></script>
</head>
<body>
  <div id="bgBoot" aria-busy="true" aria-label="Loading Bizgarh"></div>
  <div id="site-header"></div>
  <main class="page">
    <section class="page-hero">
      <div class="container">
        <h1>Contact</h1>
        <p class="muted">Course access or classroom help — write to <a href="mailto:desk@bizgarh.com">desk@bizgarh.com</a> or send a note.</p>
        <form class="form-card" id="contactForm" style="margin-top:18px">
          <div class="field"><label>Name</label><input name="name" required></div>
          <div class="field"><label>Email</label><input name="email" type="email" required></div>
          <div class="field"><label>Message</label><textarea name="message" rows="4" required></textarea></div>
          <button class="btn btn-primary">Send message</button>
          <p class="msg" id="contactMsg"></p>
        </form>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/app.js?v=dash3"></script>
  <script src="js/lms.js"></script>
</body>
</html>
