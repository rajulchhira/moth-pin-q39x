<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Help Centre | Stock Market Course FAQ | Bizgarh</title>
  <meta name="description" content="Search 111 FAQs on enroll, live desks, certificates, and journals — or write desk@bizgarh.com. Help for Bizgarh learners.">
  <script src="/js/seo.js?v=seo3" defer></script>
  <script src="/js/boot.js?v=home7"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="/css/fonts.css?v=hang1">
  <link rel="stylesheet" href="/css/style.css?v=dash64">
</head>
<body>
  <div id="bgBoot" aria-busy="true" aria-label="Loading Bizgarh"></div>
  <div id="site-header"></div>
  <main class="page help-page">
    <section class="page-hero help-hero">
      <div class="container">
        <p class="help-kicker">Help centre</p>
        <h1>How can we help?</h1>
        <p class="muted">We show the top 8 FAQs. Search to find the rest — then write the desk if you still need help.</p>
        <div id="helpFaqRoot" class="help-faq">
          <label class="help-search" for="helpFaqQ">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="helpFaqQ" type="search" placeholder="Search FAQs — enroll, live desk, certificate, journal…" autocomplete="off">
          </label>
          <div class="help-faq-meta">
            <h2>Frequently Asked Questions</h2>
            <small data-help-count></small>
          </div>
          <div class="wb-faqs" data-help-list></div>
        </div>
        <div class="help-form-wrap">
          <h2>Still need the desk?</h2>
          <p class="muted">Course access or classroom help — write to <a href="mailto:desk@bizgarh.com">desk@bizgarh.com</a> or send a note.</p>
          <form class="form-card" id="contactForm">
            <div class="field"><label>Name</label><input name="name" required></div>
            <div class="field"><label>Email</label><input name="email" type="email" required></div>
            <div class="field"><label>Message</label><textarea name="message" rows="4" required></textarea></div>
            <button class="btn btn-primary">Send message</button>
            <p class="msg" id="contactMsg"></p>
          </form>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="/js/help-faqs.js?v=faq1" defer></script>
  <script src="/js/app.js?v=desk16" defer></script>
  <script src="/js/lms.js" defer></script>
</body>
</html>
