<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rehan Khan | Courses | Bizgarh</title>
  <meta name="description" content="Course catalog from Rehan Khan — Stock Market Instructor. Open Slingshot Strategy and more on Bizgarh.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07061a">
  <link rel="icon" href="/favicon.ico?v=logo2" sizes="48x48" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="48x48" href="/img/favicon-48.png?v=logo2">
  <link rel="icon" type="image/svg+xml" href="/img/bizgarh-mark.svg?v=logo5">
  <script src="/js/seo.js?v=seo6" defer></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css?v=hang1">
  <link rel="stylesheet" href="/css/rehan.css?v=desk221">
</head>
<body class="rehan-body">
  <div class="rehan-atmosphere" aria-hidden="true">
    <div class="rehan-scene-deep-wrap">
      <canvas id="rehanSceneDeep" class="rehan-scene" width="800" height="1200"></canvas>
    </div>
    <div class="rehan-scene-mid-wrap">
      <canvas id="rehanSceneMid" class="rehan-scene" width="800" height="1200"></canvas>
    </div>
    <div class="rehan-blur-veil"></div>
    <div class="rehan-vignette"></div>
  </div>

  <main class="rehan-main">
    <header class="rehan-profile">
      <div class="rehan-mark-wrap">
        <img
          class="rehan-avatar"
          src="/img/instructors/rehan-khan.jpg?v=desk221"
          alt="Rehan Khan"
          width="112"
          height="112"
          decoding="async"
          fetchpriority="high"
        >
      </div>
      <h1 class="rehan-brand">Rehan Khan</h1>
      <p class="rehan-bio">Stock Market Instructor — Forex &amp; Indian markets. Practical process, not tips.</p>
    </header>

    <section class="rehan-section rehan-section-course" aria-label="Courses">
      <button
        type="button"
        class="rehan-course-toggle"
        id="rehanCourseToggle"
        aria-expanded="false"
        aria-controls="rehanCoursesPanel"
        data-link-id="course-toggle"
      >
        <span class="rehan-course-toggle-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </span>
        <span class="rehan-course-toggle-label">Course</span>
        <span class="rehan-course-toggle-chevron" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </span>
      </button>
      <div class="rehan-courses-panel" id="rehanCoursesPanel" hidden>
        <nav class="rehan-nav rehan-nav-courses" aria-label="Rehan Khan courses" id="rehanCoursesNav">
          <!-- Courses hydrated by js/rehan.js from /api/catalog/courses -->
        </nav>
      </div>
    </section>

    <section class="rehan-section rehan-section-social" aria-labelledby="rehanSocialHeading">
      <h2 class="rehan-section-title" id="rehanSocialHeading">Connect</h2>
      <nav class="rehan-nav rehan-nav-social" aria-label="Rehan Khan social links" id="rehanSocialNav">
        <!-- Social buttons rendered by js/rehan.js -->
      </nav>
    </section>
  </main>

  <script src="/js/rehan.js?v=desk221" defer></script>
  <script src="/js/rehan-scene.js?v=desk221" defer></script>
</body>
</html>
