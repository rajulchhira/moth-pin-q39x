[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/auth/google/callback"
  to = "/.netlify/functions/google?flow=callback"
  status = 200
  force = true

[[redirects]]
  from = "/auth/google"
  to = "/.netlify/functions/google?flow=start"
  status = 200
  force = true

[[redirects]]
  from = "/auth/telegram/callback"
  to = "/.netlify/functions/telegram?flow=callback"
  status = 200
  force = true

[[redirects]]
  from = "/auth/telegram"
  to = "/.netlify/functions/telegram?flow=start"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/ticket/*"
  to = "/.netlify/functions/ticket?ticket=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/status"
  to = "/.netlify/functions/status"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/learn"
  to = "/course"
  status = 301
  force = true

[[redirects]]
  from = "/:page"
  to = "/:page.html"
  status = 200
