<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Live Stock Market Classes & Nifty Options Webinars | Bizgarh</title>
  <meta name="description" content="Join live stock market classes, Nifty options webinars, mentorship desks, and 1:1 journal reviews inside Bizgarh — not on Zoom.">
  <script src="/js/seo.js?v=seo3" defer></script>
  <script src="/js/boot.js?v=home7"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="/css/fonts.css?v=hang1">
  <link rel="stylesheet" href="/css/style.css?v=dash64">
</head>
<body class="wb-body">
  <div id="bgBoot" aria-busy="true" aria-label="Loading Bizgarh"></div>
  <div id="site-header"></div>
  <main class="page">
    <div id="liveCatalog">
      <section class="page-hero"><div class="container">
        <h1>Live stock market classes</h1>
        <p>Upcoming webinars: <a href="/webinar?id=w1">Gap &amp; Go for Nifty Options</a>, <a href="/webinar?id=w2">Defined-Risk Credit Spreads</a>, <a href="/webinar?id=w3">Reading Weekly Structure</a>. Also see <a href="/mentorship">mentorship programs</a>.</p>
      </div></section>
    </div>
    <section class="section" id="classes">
      <div class="container">
        <h2>Live classes</h2>
        <div class="wb-grid" id="classList" style="margin-top:18px"></div>
      </div>
    </section>
    <section class="section" id="mentorship">
      <div class="container" id="mentorHomeList"></div>
    </section>
    <section class="section" id="call">
      <div class="container">
        <h2>Book a 1:1 call</h2>
        <p class="muted" style="margin-bottom:16px">45 minutes on your journal, risk, or a stuck setup. After approval, join inside Bizgarh.</p>
        <form class="form-card" id="callForm">
          <div class="field"><label>Topic</label><select name="topic" required>
            <option value="">Choose</option>
            <option>Risk & sizing</option>
            <option>Options setup</option>
            <option>Investing plan</option>
            <option>Journal review</option>
          </select></div>
          <div class="field"><label>Mentor</label>
            <select name="mentor">
              <option value="">Any available</option>
              <option>Aarav Mehta</option>
              <option>Neha Kapoor</option>
              <option>Vikram Singh</option>
              <option>Ananya Rao</option>
            </select>
          </div>
          <div class="field"><label>Preferred date</label><input name="date" type="date" required></div>
          <div class="field"><label>Preferred time</label><input name="time" type="time" required></div>
          <div class="field"><label>Notes</label><textarea name="notes" placeholder="What is stuck?"></textarea></div>
          <button class="btn btn-orange">Request a slot</button>
        </form>
        <div data-faq-set="call" data-faq-title="1:1 call questions" style="margin-top:28px"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="/js/app.js?v=desk10" defer></script>
  <script src="/js/lms.js" defer></script>
</body>
</html>
